<!DOCTYPE html>
<html lang="pt-BR">
<head><base href="https://d16ilfvy4mv02r.cloudfront.net/workspaces/l593qDwS2YSQ1Uku4RFs2xr41fHGB26S/a256e118-d92e-42e1-9ce7-0a0460072b6a/files/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vcn.style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#252525;
  --surface:#2f2f2f;
  --surface2:#3a3a3a;
  --border:#4a4a4a;
  --accent:#c8c8c8;
  --accent2:#f0f0f0;
  --text:#f0f0f0;
  --muted:#909090;
  --radius:12px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  /* gradiente cinza suave no canto superior esquerdo */
  background-image: radial-gradient(ellipse 55% 40% at 0% 0%, rgba(220,220,220,0.07) 0%, transparent 70%);
  background-attachment: fixed;
}

/* HEADER */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(37,37,37,0.97);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:0 2rem;
  display:flex;align-items:center;justify-content:space-between;
  height:68px;
}
.logo-wrap{display:flex;align-items:center;gap:0.75rem}
.logo-img{height:46px;width:46px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.logo-main{font-size:1.2rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--accent2)}
.logo-sub{font-size:0.6rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:0.7rem}
.btn-admin{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:0.45rem 1rem;border-radius:6px;font-size:0.8rem;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s
}
.btn-admin:hover{border-color:var(--accent);color:var(--accent)}
.btn-wpp{
  background:linear-gradient(135deg,#2a9d5c,#25d366);
  color:#fff;padding:0.48rem 1rem;
  border-radius:6px;font-weight:700;font-size:0.82rem;
  text-decoration:none;white-space:nowrap;transition:opacity .2s
}
.btn-wpp:hover{opacity:0.85}

/* HERO */
.hero{
  text-align:center;padding:5rem 1rem 3rem;
  position:relative;
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(200,200,200,0.06),transparent);
  pointer-events:none;
}
.hero-logo{
  width:120px;height:120px;object-fit:cover;
  border-radius:24px;border:1px solid var(--border);
  margin-bottom:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5)
}
.hero-tag{
  display:inline-block;
  background:rgba(200,200,200,0.08);border:1px solid rgba(200,200,200,0.2);
  color:var(--accent);font-size:0.7rem;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;padding:0.3rem 1rem;border-radius:999px;margin-bottom:1.2rem
}
.hero h1{
  font-size:clamp(2.8rem,9vw,6rem);font-weight:800;letter-spacing:6px;
  text-transform:uppercase;line-height:1;
  background:linear-gradient(135deg,#fff 30%,#888 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.hero p{margin-top:1rem;color:var(--muted);font-size:0.95rem;max-width:420px;margin-inline:auto;line-height:1.6}
.hero-divider{width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:1.5rem auto 0}

/* TABS */
.tabs-wrapper{max-width:1200px;margin:0 auto;padding:0 1.5rem 5rem}
.tabs-nav{
  display:flex;gap:0.2rem;overflow-x:auto;
  scrollbar-width:none;border-bottom:1px solid var(--border);
  margin-bottom:2.5rem;
}
.tabs-nav::-webkit-scrollbar{display:none}
.tab-btn{
  background:none;border:none;color:var(--muted);
  font-size:0.78rem;font-weight:600;letter-spacing:0.8px;
  text-transform:uppercase;cursor:pointer;padding:0.75rem 1.1rem;
  white-space:nowrap;transition:all .2s;
  font-family:'Inter',sans-serif;
  border-bottom:2px solid transparent;margin-bottom:-1px
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent)}

/* PANELS */
.tab-panel{display:none}
.tab-panel.active{display:block}
.section-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem}
.section-title{font-size:1.5rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
.section-count{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:0.72rem;padding:0.25rem 0.75rem;border-radius:999px}

/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.2rem}
.product-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:transform .25s,border-color .25s,box-shadow .25s
}
.product-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 16px 40px rgba(0,0,0,0.4)}
.product-thumb{
  width:100%;aspect-ratio:3/4;
  background:linear-gradient(135deg,var(--surface2),#444);
  display:flex;align-items:center;justify-content:center;
  font-size:3.2rem;position:relative;overflow:hidden
}
.product-thumb img{width:100%;height:100%;object-fit:cover}
.product-badge-label{
  position:absolute;top:0.6rem;left:0.6rem;
  background:var(--accent);color:#222;
  font-size:0.62rem;font-weight:800;
  padding:0.22rem 0.55rem;border-radius:4px;
  text-transform:uppercase;letter-spacing:0.5px
}
.product-info{padding:0.9rem 1rem 0.2rem}
.product-name{font-weight:600;font-size:0.88rem;margin-bottom:0.35rem;color:var(--text)}
.product-price{color:var(--accent2);font-weight:700;font-size:1rem}
.product-original{color:var(--muted);font-size:0.74rem;text-decoration:line-through;margin-left:0.4rem}
.product-link-btn{
  display:block;margin:0.8rem 1rem 1rem;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);text-align:center;
  padding:0.55rem;border-radius:8px;
  font-size:0.78rem;font-weight:600;text-decoration:none;
  transition:all .2s
}
.product-link-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent2)}

/* EMPTY */
.empty-state{text-align:center;padding:5rem 1rem;color:var(--muted)}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;opacity:0.5}
.empty-state h3{font-size:1rem;color:var(--text);margin-bottom:0.5rem}

/* FOOTER */
footer{border-top:1px solid var(--border);text-align:center;padding:2.5rem;color:var(--muted);font-size:0.78rem;background:var(--surface)}
.footer-logo{font-size:1rem;font-weight:800;letter-spacing:3px;color:var(--accent2);margin-bottom:0.4rem}

/* ====== ADMIN MODAL ====== */
#admin-overlay{
  display:none;
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0.9);
  backdrop-filter:blur(8px);
  overflow-y:auto;
  padding:1.5rem 1rem 3rem;
}
.admin-box{
  background:#2a2a2a;border:1px solid var(--border);
  border-radius:16px;max-width:600px;
  margin:0 auto;padding:2rem;
}
.admin-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.admin-hdr h2{font-size:1.1rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent2)}
.close-btn{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;transition:color .2s;line-height:1;padding:0.2rem 0.4rem}
.close-btn:hover{color:var(--accent2)}

/* tabs internas do admin */
.admin-tabs{display:flex;gap:0.4rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:0}
.admin-tab{
  background:none;border:none;color:var(--muted);
  font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
  cursor:pointer;padding:0.6rem 1rem;
  font-family:'Inter',sans-serif;transition:all .2s;
  border-bottom:2px solid transparent;margin-bottom:-1px
}
.admin-tab:hover{color:var(--text)}
.admin-tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.admin-section{display:none}
.admin-section.active{display:block}

/* form */
.fg{margin-bottom:1.1rem}
.fg label{display:block;font-size:0.72rem;color:var(--muted);margin-bottom:0.4rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.fg input,.fg select{
  width:100%;background:#333;border:1px solid var(--border);
  color:var(--text);padding:0.65rem 0.9rem;
  border-radius:8px;font-family:'Inter',sans-serif;
  font-size:0.88rem;transition:border-color .2s
}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--accent)}
.fg select option{background:#333}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}

.btn-add{
  width:100%;background:var(--accent);color:#222;
  border:none;padding:0.8rem;border-radius:8px;
  font-weight:800;font-size:0.9rem;cursor:pointer;
  font-family:'Inter',sans-serif;transition:background .2s;margin-top:0.3rem
}
.btn-add:hover{background:var(--accent2)}
.btn-add.editing{background:#5a8a5a;color:#fff}
.btn-add.editing:hover{background:#6aaa6a}

.divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0}

/* lista de produtos no admin */
.alhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem}
.alhdr span{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.btn-clr{background:none;border:none;color:#c06060;font-size:0.78rem;cursor:pointer;font-family:'Inter',sans-serif}

.al-item{
  display:flex;align-items:center;gap:0.5rem;
  background:#333;border:1px solid var(--border);
  border-radius:8px;padding:0.65rem 0.8rem;margin-bottom:0.5rem;
  transition:border-color .2s
}
.al-item.editing-highlight{border-color:var(--accent);background:#3a3a3a}
.al-item-info{flex:1;min-width:0}
.al-item-info strong{display:block;font-size:0.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-item-info small{color:var(--muted);font-size:0.73rem}

/* botoes de acao do item */
.item-actions{display:flex;align-items:center;gap:0.2rem;flex-shrink:0}
.iab{
  background:none;border:1px solid transparent;color:var(--muted);
  cursor:pointer;font-size:0.85rem;padding:0.25rem 0.4rem;
  border-radius:6px;transition:all .2s;line-height:1;
  font-family:'Inter',sans-serif
}
.iab:hover{border-color:var(--border);color:var(--text)}
.iab.up:hover{color:#90c0ff;border-color:#90c0ff}
.iab.down:hover{color:#90c0ff;border-color:#90c0ff}
.iab.edit:hover{color:#90e090;border-color:#90e090}
.iab.del:hover{color:#e07070;border-color:#e07070}

.al-empty{color:var(--muted);font-size:0.85rem;text-align:center;padding:1.5rem}

@media(max-width:600px){
  header{padding:0 1rem}
  .logo-img{height:38px;width:38px}
  .frow{grid-template-columns:1fr}
  .hero{padding:3.5rem 1rem 2.5rem}
  .hero-logo{width:90px;height:90px}
  .item-actions .iab span{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="logo.png" alt="vcn.style" class="logo-img">
    <div>
      <div class="logo-main">vcn.style</div>
      <div class="logo-sub">Revenda Shein</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-admin" id="btnAdmin">&#9881; Gerenciar</button>
    <a href="https://wa.me/5500000000000" class="btn-wpp" target="_blank">&#128172; WhatsApp</a>
  </div>
</header>

<section class="hero">
  <img src="logo.png" alt="vcn.style" class="hero-logo">
  <div class="hero-tag">&#10022; Nova colecao disponivel</div>
  <h1>VCN.STYLE</h1>
  <p>Os melhores estilos Shein com curadoria exclusiva. Encontre seu look perfeito.</p>
  <div class="hero-divider"></div>
</section>

<div class="tabs-wrapper">
  <nav class="tabs-nav" id="tabsNav">
    <button class="tab-btn active" data-tab="todos">Todos</button>
    <button class="tab-btn" data-tab="streetwear">Streetwear</button>
    <button class="tab-btn" data-tab="esporteFino">Esporte Fino</button>
    <button class="tab-btn" data-tab="polo">Polo</button>
    <button class="tab-btn" data-tab="casual">Casual</button>
    <button class="tab-btn" data-tab="feminino">Feminino</button>
    <button class="tab-btn" data-tab="acessorios">Acessorios</button>
  </nav>
  <div id="panel-todos" class="tab-panel active"></div>
  <div id="panel-streetwear" class="tab-panel"></div>
  <div id="panel-esporteFino" class="tab-panel"></div>
  <div id="panel-polo" class="tab-panel"></div>
  <div id="panel-casual" class="tab-panel"></div>
  <div id="panel-feminino" class="tab-panel"></div>
  <div id="panel-acessorios" class="tab-panel"></div>
</div>

<footer>
  <div class="footer-logo">VCN.STYLE</div>
  <p>2025 vcn.style - Revenda Shein com curadoria exclusiva</p>
</footer>

<!-- ADMIN MODAL -->
<div id="admin-overlay">
  <div class="admin-box">
    <div class="admin-hdr">
      <h2 id="adminTitle">&#9881; Gerenciar Produtos</h2>
      <button class="close-btn" id="btnClose">&#10005;</button>
    </div>

    <!-- abas internas -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-sec="add">&#43; Adicionar</button>
      <button class="admin-tab" data-sec="list">&#9776; Organizar</button>
    </div>

    <!-- SECAO: ADICIONAR / EDITAR -->
    <div class="admin-section active" id="sec-add">
      <div class="frow">
        <div class="fg">
          <label>Nome *</label>
          <input type="text" id="fName" placeholder="Ex: Moletom Oversized">
        </div>
        <div class="fg">
          <label>Categoria *</label>
          <select id="fCat">
            <option value="streetwear">Streetwear</option>
            <option value="esporteFino">Esporte Fino</option>
            <option value="polo">Polo</option>
            <option value="casual">Casual</option>
            <option value="feminino">Feminino</option>
            <option value="acessorios">Acessorios</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label>Preco (R$) *</label>
          <input type="text" id="fPrice" placeholder="Ex: 89,90">
        </div>
        <div class="fg">
          <label>Preco Original (riscado)</label>
          <input type="text" id="fOriginal" placeholder="Ex: 129,90">
        </div>
      </div>
      <div class="fg">
        <label>Link Shein *</label>
        <input type="url" id="fLink" placeholder="https://shein.com.br/produto/...">
      </div>
      <div class="frow">
        <div class="fg">
          <label>URL da Imagem</label>
          <input type="url" id="fImg" placeholder="https://...">
        </div>
        <div class="fg">
          <label>Badge</label>
          <input type="text" id="fBadge" placeholder="Ex: NOVO, -30%">
        </div>
      </div>
      <input type="hidden" id="editId" value="">
      <button class="btn-add" id="btnAdd">&#43; Adicionar Produto</button>
      <div id="editCancelWrap" style="display:none;margin-top:0.6rem">
        <button id="btnCancelEdit" style="width:100%;background:none;border:1px solid var(--border);color:var(--muted);padding:0.65rem;border-radius:8px;font-family:Inter,sans-serif;font-size:0.85rem;cursor:pointer;transition:all .2s">Cancelar edicao</button>
      </div>
    </div>

    <!-- SECAO: ORGANIZAR -->
    <div class="admin-section" id="sec-list">
      <div class="alhdr">
        <span id="countLabel">0 produtos</span>
        <button class="btn-clr" id="btnClear">&#128465; Remover todos</button>
      </div>
      <div id="adminList"></div>
    </div>

  </div>
</div>

<script>
var CAT_LABEL = {
  todos:'Todos',
  streetwear:'Streetwear',
  esporteFino:'Esporte Fino',
  polo:'Polo',
  casual:'Casual',
  feminino:'Feminino',
  acessorios:'Acessorios'
};
var TABS = ['todos','streetwear','esporteFino','polo','casual','feminino','acessorios'];

function loadP(){ try{return JSON.parse(localStorage.getItem('vcn_p')||'[]')}catch(e){return[]} }
function saveP(a){ localStorage.setItem('vcn_p',JSON.stringify(a)) }

var products = loadP();

if(products.length===0){
  products=[
    {id:1,name:'Moletom Oversized',   price:'89,90', original:'129,90',cat:'streetwear', link:'#',img:'',badge:'NOVO'},
    {id:2,name:'Calca Cargo Preta',   price:'79,90', original:'',      cat:'streetwear', link:'#',img:'',badge:''},
    {id:3,name:'Camisa Social Slim',  price:'69,90', original:'99,90', cat:'esporteFino',link:'#',img:'',badge:'OFERTA'},
    {id:4,name:'Blazer Casual',       price:'149,90',original:'',      cat:'esporteFino',link:'#',img:'',badge:''},
    {id:5,name:'Polo Classic Branca', price:'59,90', original:'85,90', cat:'polo',       link:'#',img:'',badge:''},
    {id:6,name:'Polo Listrada',       price:'64,90', original:'',      cat:'polo',       link:'#',img:'',badge:'NOVO'},
    {id:7,name:'Camiseta Basica',     price:'39,90', original:'',      cat:'casual',     link:'#',img:'',badge:''},
    {id:8,name:'Vestido Floral',      price:'99,90', original:'139,90',cat:'feminino',   link:'#',img:'',badge:'OFERTA'},
    {id:9,name:'Oculos Retro',        price:'34,90', original:'',      cat:'acessorios', link:'#',img:'',badge:''}
  ];
  saveP(products);
}

/* ---- RENDER SITE ---- */
function makeCard(p){
  var imgPart = p.img
    ? '<img src="'+p.img+'" alt="'+p.name+'" onerror="this.parentNode.innerHTML=\'&#128248;\'">'
    : '<span>&#128248;</span>';
  var badgePart = p.badge ? '<div class="product-badge-label">'+p.badge+'</div>' : '';
  var origPart  = p.original ? '<span class="product-original">R$ '+p.original+'</span>' : '';
  var c = document.createElement('div');
  c.className='product-card';
  c.innerHTML=
    '<div class="product-thumb">'+imgPart+badgePart+'</div>'+
    '<div class="product-info">'+
      '<div class="product-name">'+p.name+'</div>'+
      '<div><span class="product-price">R$ '+p.price+'</span>'+origPart+'</div>'+
    '</div>'+
    '<a class="product-link-btn" href="'+p.link+'" target="_blank" rel="noopener">Ver na Shein &#8594;</a>';
  return c;
}

function renderPanels(){
  TABS.forEach(function(tab){
    var panel=document.getElementById('panel-'+tab);
    var items=tab==='todos'?products:products.filter(function(p){return p.cat===tab});
    panel.innerHTML='';
    if(items.length===0){
      panel.innerHTML='<div class="empty-state"><div class="icon">&#128717;</div><h3>Nenhum produto nesta categoria</h3><p>Adicione pelo painel Gerenciar.</p></div>';
      return;
    }
    var hdr=document.createElement('div');
    hdr.className='section-header';
    hdr.innerHTML='<div class="section-title">'+CAT_LABEL[tab]+'</div><div class="section-count">'+items.length+' item'+(items.length>1?'s':'')+'</div>';
    panel.appendChild(hdr);
    var grid=document.createElement('div');
    grid.className='product-grid';
    items.forEach(function(p){grid.appendChild(makeCard(p))});
    panel.appendChild(grid);
  });
}

/* ---- TABS NAV ---- */
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
    btn.classList.add('active');
    document.getElementById('panel-'+btn.getAttribute('data-tab')).classList.add('active');
  });
});

/* ---- ADMIN MODAL ---- */
var overlay=document.getElementById('admin-overlay');

document.getElementById('btnAdmin').addEventListener('click',function(){
  overlay.style.display='block';
  renderAdminList();
});
document.getElementById('btnClose').addEventListener('click',function(){
  overlay.style.display='none';
  renderPanels();
});
overlay.addEventListener('click',function(e){
  if(e.target===overlay){overlay.style.display='none';renderPanels();}
});

/* ---- ADMIN INTERNAL TABS ---- */
document.querySelectorAll('.admin-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.admin-section').forEach(function(s){s.classList.remove('active')});
    tab.classList.add('active');
    document.getElementById('sec-'+tab.getAttribute('data-sec')).classList.add('active');
    if(tab.getAttribute('data-sec')==='list') renderAdminList();
  });
});

/* ---- ADD / EDIT PRODUCT ---- */
var editingId = null;

document.getElementById('btnAdd').addEventListener('click',function(){
  var name     = document.getElementById('fName').value.trim();
  var price    = document.getElementById('fPrice').value.trim();
  var original = document.getElementById('fOriginal').value.trim();
  var cat      = document.getElementById('fCat').value;
  var link     = document.getElementById('fLink').value.trim();
  var img      = document.getElementById('fImg').value.trim();
  var badge    = document.getElementById('fBadge').value.trim();

  if(!name)  {alert('Preencha o Nome.');return}
  if(!price) {alert('Preencha o Preco.');return}
  if(!link)  {alert('Preencha o Link.');return}

  if(editingId!==null){
    // EDITAR existente
    for(var i=0;i<products.length;i++){
      if(products[i].id===editingId){
        products[i].name=name;
        products[i].price=price;
        products[i].original=original;
        products[i].cat=cat;
        products[i].link=link;
        products[i].img=img;
        products[i].badge=badge;
        break;
      }
    }
    saveP(products);
    cancelEdit();
    // voltar para aba organizar
    document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.admin-section').forEach(function(s){s.classList.remove('active')});
    document.querySelector('.admin-tab[data-sec="list"]').classList.add('active');
    document.getElementById('sec-list').classList.add('active');
    renderAdminList();
  } else {
    // NOVO
    products.push({id:Date.now(),name:name,price:price,original:original,cat:cat,link:link,img:img,badge:badge});
    saveP(products);
    clearForm();
    renderAdminList();
  }
});

function clearForm(){
  ['fName','fPrice','fOriginal','fLink','fImg','fBadge'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('fCat').value='streetwear';
}

function cancelEdit(){
  editingId=null;
  var btn=document.getElementById('btnAdd');
  btn.textContent='+ Adicionar Produto';
  btn.classList.remove('editing');
  document.getElementById('editCancelWrap').style.display='none';
  clearForm();
}

document.getElementById('btnCancelEdit').addEventListener('click',function(){
  cancelEdit();
});

/* ---- CLEAR ALL ---- */
document.getElementById('btnClear').addEventListener('click',function(){
  if(confirm('Remover TODOS os produtos? Nao da pra desfazer.')){
    products=[];saveP(products);renderAdminList();
  }
});

/* ---- RENDER ADMIN LIST ---- */
function renderAdminList(){
  var list=document.getElementById('adminList');
  var countEl=document.getElementById('countLabel');
  countEl.textContent=products.length+' produto'+(products.length!==1?'s':'');

  if(products.length===0){
    list.innerHTML='<div class="al-empty">Nenhum produto cadastrado ainda.</div>';
    return;
  }

  list.innerHTML='';
  products.forEach(function(p,idx){
    var row=document.createElement('div');
    row.className='al-item'+(editingId===p.id?' editing-highlight':'');

    var canUp   = idx>0;
    var canDown = idx<products.length-1;

    row.innerHTML=
      '<div class="al-item-info">'+
        '<strong>'+p.name+'</strong>'+
        '<small>'+CAT_LABEL[p.cat]+'&nbsp;&middot;&nbsp;R$ '+p.price+'</small>'+
      '</div>'+
      '<div class="item-actions">'+
        '<button class="iab up" data-idx="'+idx+'" '+(canUp?'':'disabled style="opacity:0.25;cursor:default"')+' title="Mover para cima">&#8593;</button>'+
        '<button class="iab down" data-idx="'+idx+'" '+(canDown?'':'disabled style="opacity:0.25;cursor:default"')+' title="Mover para baixo">&#8595;</button>'+
        '<button class="iab edit" data-id="'+p.id+'" title="Editar">&#9998;</button>'+
        '<button class="iab del" data-id="'+p.id+'" title="Remover">&#128465;</button>'+
      '</div>';

    list.appendChild(row);
  });

  /* mover para cima */
  list.querySelectorAll('.iab.up').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=parseInt(btn.getAttribute('data-idx'));
      if(idx===0) return;
      var tmp=products[idx-1];
      products[idx-1]=products[idx];
      products[idx]=tmp;
      saveP(products);
      renderAdminList();
    });
  });

  /* mover para baixo */
  list.querySelectorAll('.iab.down').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=parseInt(btn.getAttribute('data-idx'));
      if(idx>=products.length-1) return;
      var tmp=products[idx+1];
      products[idx+1]=products[idx];
      products[idx]=tmp;
      saveP(products);
      renderAdminList();
    });
  });

  /* editar */
  list.querySelectorAll('.iab.edit').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=parseInt(btn.getAttribute('data-id'));
      var p=null;
      for(var i=0;i<products.length;i++){if(products[i].id===id){p=products[i];break;}}
      if(!p) return;

      editingId=id;

      document.getElementById('fName').value=p.name;
      document.getElementById('fPrice').value=p.price;
      document.getElementById('fOriginal').value=p.original||'';
      document.getElementById('fCat').value=p.cat;
      document.getElementById('fLink').value=p.link;
      document.getElementById('fImg').value=p.img||'';
      document.getElementById('fBadge').value=p.badge||'';

      var addBtn=document.getElementById('btnAdd');
      addBtn.textContent='Salvar alteracoes';
      addBtn.classList.add('editing');
      document.getElementById('editCancelWrap').style.display='block';

      /* mudar para aba adicionar/editar */
      document.querySelectorAll('.admin-tab').forEach(function(t){t.classList.remove('active')});
      document.querySelectorAll('.admin-section').forEach(function(s){s.classList.remove('active')});
      document.querySelector('.admin-tab[data-sec="add"]').classList.add('active');
      document.getElementById('sec-add').classList.add('active');

      /* scroll pro topo do form */
      document.getElementById('sec-add').scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  /* deletar */
  list.querySelectorAll('.iab.del').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=parseInt(btn.getAttribute('data-id'));
      if(!confirm('Remover este produto?')) return;
      products=products.filter(function(p){return p.id!==id});
      if(editingId===id) cancelEdit();
      saveP(products);
      renderAdminList();
    });
  });
}

/* INIT */
renderPanels();
</script>
</body>
